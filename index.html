    function padModalInput(input, maxVal) {
        let val = parseInt(input.value, 10);
        if (isNaN(val)) val = 0;
        if (val > maxVal) val = maxVal;
        if (val < 0) val = 0;
        input.value = String(val).padStart(2, '0');
    }

    // ---- 时分秒滚轮 ----
    // 循环滚动：同一组数字铺 5 遍，停稳后悄悄挪回中间那遍。必须等惯性结束再挪，iOS 上中途改 scrollTop 会把惯性掐断
    const WHEEL_LOOPS = 5, WHEEL_IDLE_MS = 140;
    const modalWheels = {};

    function createTimeWheel(host, key, count, label) {
        const col = document.createElement('div'), scroller = document.createElement('div'), input = document.createElement('input');
        col.className = 'wheel-col';
        scroller.className = 'wheel';
        scroller.tabIndex = 0;
        scroller.setAttribute('role', 'spinbutton');
        scroller.setAttribute('aria-label', label);
        scroller.setAttribute('aria-valuemin', 0);
        scroller.setAttribute('aria-valuemax', count - 1);
        for (let i = 0; i < count * WHEEL_LOOPS; i++) {
            const row = document.createElement('div');
            row.className = 'wheel-row';
            row.dataset.i = i;
            row.textContent = pad2(i % count);
            scroller.appendChild(row);
        }
        input.className = 'wheel-input';
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = 0;
        input.max = count - 1;
        input.hidden = true;
        input.setAttribute('aria-label', label);
        col.append(scroller, input);
        host.appendChild(col);

        const mod = (v) => ((v % count) + count) % count;
        const rowH = () => scroller.firstChild.offsetHeight;
        const middle = count * Math.floor(WHEEL_LOOPS / 2);
        const wheel = { target: null, touching: false, idleTimer: 0 };   // target：程序设定、动画还没走完时的值
        wheel.get = () => wheel.target !== null ? wheel.target : mod(Math.round(scroller.scrollTop / rowH()));
        wheel.set = (v, animate) => {
            wheel.target = mod(v);
            const smooth = animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!smooth) { scroller.scrollTop = (middle + wheel.target) * rowH(); wheel.settle(); return; }
            const cur = Math.round(scroller.scrollTop / rowH());
            let d = mod(wheel.target - cur);
            if (d > count / 2) d -= count;                     // 走近的方向，59 到 00 只滚一格
            scroller.scrollTo({ top: (cur + d) * rowH(), behavior: 'smooth' });
        };
        wheel.settle = () => {
            clearTimeout(wheel.idleTimer);

        scroller.addEventListener('touchstart', grab, { passive: true });
        scroller.addEventListener('touchend', release);
        scroller.addEventListener('touchcancel', release);
        scroller.addEventListener('wheel', () => { wheel.target = null; waitIdle(); }, { passive: true });
        scroller.addEventListener('scroll', waitIdle, { passive: true });

            const row = e.target.closest('.wheel-row');
            if (!row) return;
            const v = Number(row.dataset.i) % count;
            if (v !== wheel.get()) { wheel.set(v, true); return; }

            padModalInput(input, count - 1);
            input.hidden = true;
            wheel.set(Number(input.value), false);

    function buildPane(y, m, selD, actualToday) {
        let lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
        lead = lead === 0 ? 6 : lead - 1;                       // 周一开头
        const total = daysInMonthOf(y, m);
        const isTodayMonth = (actualToday.year === y && actualToday.month === m);
        let html = '';
        for (let i = 0; i < lead; i++) html += `<div class="empty"></div>`;
        for (let i = 1; i <= total; i++) {
            const cls = [];
            if (i === selD) cls.push('selected');
            if (isTodayMonth && i === actualToday.day) cls.push('today');
            html += `<div class="${cls.join(' ')}" onclick="pickDay(${y}, ${m}, ${i})"><span>${i}</span></div>`;
        }
        for (let i = lead + total; i < 42; i++) html += `<div class="empty"></div>`;
        return html;
    }

    // 日历就卡在两个月中间（10-30 代码审查指出，探针实测 isConnected=false）
    function renderCalendar(rot) {
        if (!rot) dpc.back = null;
        dpcStop();     // 调用方（点格子 / 菜单 / 今天 / 翻月落定）都已写好确定的年月：动画直接停，不能再补翻一次
        // 选了 31 号再切到小月：收到当月最后一天，否则会存进「2月31日」这种不存在的日期
        selectedDay = dpClampD(viewYear, viewMonth, selectedDay);

        const trk = document.getElementById('dpTrk');
        const mk = (y, m) => {
            const g = document.createElement('div');
            g.className = 'days'; g.__y = y; g.__m = m;
            g.innerHTML = buildPane(y, m, dpClampD(y, m, selectedDay), actualToday);
            return g;

        if (rot && k.length === 3) {

            if (rot > 0) { trk.removeChild(k[0]); trk.appendChild(mk(y, m)); }

    function renderPickedInfo(y = viewYear, m = viewMonth, d = selectedDay) {

    function confirmModal() {

    // ================= 日历左右滑切月 =================
    // 2026-10-30 照一日轨道（day-rail）搬来，参数一个没改，三个站手感一致。翻页物理照 iOS
    // （来由见记忆库 feedback_ios_gesture_recipe §4.6「翻页物理」）：
    // · 翻不翻看「松手位置 + 速度 × 499」的投影（UIScrollView 减速率 0.998）有没有过半，快扫一下也能翻
    // · 落位用带初速度的弹簧（SwiftUI .snappy：response .4 / damping .86），接住松手速度，过冲封顶 14px
    // · 弹簧采样成关键帧交给 Web Animations 播；动画半路再按下去就地停住、接着拖
    // 轨道常态停在 -100%（中间那块）；拖动 / 动画时用像素写，落位后才真正翻月、重画三块。
    // 只在日期格和星期那一行上起手；屏幕左右边缘 28px 留给浏览器返回
    const DPC_LOCK2 = 100,      // 动够 10px 才判方向（平方）
          DPC_ANGLE = 45, DPC_EDGE = 28, DPC_HOLD = 500,
          DPC_PROJECT = 0.998 / (1 - 0.998),
          DPC_RESP = 0.4, DPC_DAMP = 0.86, DPC_HZ = 240, DPC_MAX_MS = 620, DPC_OVER = 14,
          DPC_GAP = 32;           // 三个月之间的空隙，和 CSS .dp-trk 的 gap 一致；翻一页走「一块宽 + 空隙」
    const dpcRM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
    // 带初速度的弹簧，采样成 0→1 的进度。distance = 起点 − 终点（px），velocity = 松手速度（px/ms）
    function dpcSpring(distance, velocity) {
        const w0 = 2 * Math.PI / DPC_RESP, z = DPC_DAMP, wd = w0 * Math.sqrt(1 - z * z), dt = 1 / DPC_HZ;
        function sample(v0) {
            const B = (v0 + z * w0) / wd, out = [];
            for (let i = 0; ; i++) {

                if (t >= DPC_MAX_MS / 1000) break;
                const u = Math.exp(-z * w0 * t) * (Math.cos(wd * t) + B * Math.sin(wd * t));
                out.push(1 - u);

            }

        const over = a => (Math.max.apply(null, a) - 1) * Math.abs(distance);
        let v0 = distance ? (velocity * 1000) / distance : 0, pts = sample(v0);
        if (over(pts) > DPC_OVER) {           // 0 速度一定不过冲：二分找一个刚好不超的初速度
            let lo = 0, hi = v0;
            for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2, c = sample(mid); if (over(c) > DPC_OVER) hi = mid; else { lo = mid; pts = c; } }
        }
        pts[pts.length - 1] = 1;              // 最后一点钉死，保证精确落位
        return { ms: Math.round(Math.max(120, (pts.length - 1) * dt * 1000)), pts };

    const dpc = { track: false, lock: false, pos: 0, base: 0, W: 1, x0: 0, y0: 0, t0: 0, lx: 0, lt: 0, v: 0, anim: null, dir: 0, guard: 0, gx: 0, gy: 0, back: null };
    const dpTrkEl = () => document.getElementById('dpTrk');
    function dpcSet(x) { dpc.pos = x; dpTrkEl().style.transform = x ? 'translate3d(' + (x - dpc.W) + 'px,0,0)' : ''; }

    // 按选中的日子重标一块（那个月没那么多天就收到最后一天）
    function dpMarkSel(g, dd) {

    // 翻过去：年月标题马上换，轨道带着速度滑过去，落位后再真正重画
    function dpcGo(dir, v) {

        dpc.dir = dir; dpHead(y, m); renderPickedInfo(y, m, dpcDayFor(y, m));

    function dpcFinish() {

    // 动画半路按住：停在原处；要去的那个月已经露出来了，就逻辑上先翻过去、画面不动

        }

    }

    function dpcCanGo(dir) {

    function dpStep(event, dir) {

        if (dpc.anim) { dpcFinish(); renderCalendar(); }
        dpc.back = null;
        if (!dpcCanGo(dir)) return;
        if (!dpcCanAnimate()) { dpcCommit(dir); return; }

    function setupMonthSwipe() {
        const card = document.querySelector('#datePickerModal .ios-picker');
        card.addEventListener('touchstart', ev => {
            if (dpc.track) { dpcAbandon(); return; }        // 第二根手指，或上一次丢了 touchend：先归位，别停在半路
            if (ev.touches.length !== 1 || document.querySelector('.select-menu.show')) return;   // 下拉菜单开着：那是在滚菜单
            if (!ev.target.closest('.dp-vp, .weekdays')) return;
            const t = ev.touches[0];
            if (t.clientX < DPC_EDGE || t.clientX > document.documentElement.clientWidth - DPC_EDGE) return;
            dpc.W = dpTrkEl().offsetWidth + DPC_GAP;
            dpcCatch();
            dpc.base = dpc.pos;
            dpc.x0 = dpc.lx = t.clientX; dpc.y0 = t.clientY;
            dpc.t0 = dpc.lt = ev.timeStamp || Date.now(); dpc.v = 0;

            if (ev.touches.length !== 1) { dpcAbandon(); return; }

            if (!dpc.lock) {

                if (mx * mx + my * my < DPC_LOCK2) { if (Math.abs(mx) > Math.abs(my) && ev.cancelable) ev.preventDefault(); return; }
                const now0 = ev.timeStamp || Date.now();

                dpc.lock = true; dpTrkEl().style.willChange = 'transform';

            if (p > 0 && !dpcCanGo(-1)) p = Math.min(p, dpc.W / 3);
            if (p <= -dpc.W) { dpcCommit(1); dpc.base += dpc.W; p += dpc.W; }        // 拖过一整个月：逻辑上先翻，画面接着跟手
            else if (p >= dpc.W) { dpcCommit(-1); dpc.base -= dpc.W; p -= dpc.W; }

                else dpcSettle(0);

            }
            dpc.lock = false;
            const ct = ev && ev.changedTouches && ev.changedTouches[0];
            dpc.guard = Date.now() + 350; dpc.gx = ct ? ct.clientX : dpc.lx; dpc.gy = ct ? ct.clientY : dpc.y0;
            const now = (ev && ev.timeStamp) || Date.now();
            if (now - dpc.lt > 100) dpc.v = 0;                          // 停住再松手不算甩
            if (ev && ev.type === 'touchcancel') { dpcSettle(0); return; }
            const proj = dpc.pos + dpc.v * DPC_PROJECT;
            if (Math.abs(proj) > dpc.W / 2 && dpcCanGo(proj < 0 ? 1 : -1)) {
                if (dpcCanAnimate()) dpcGo(proj < 0 ? 1 : -1, dpc.v);
                else { dpcSet(0); dpcCommit(proj < 0 ? 1 : -1); }
            } else dpcSettle(dpc.v);
        }
        card.addEventListener('touchend', end, { passive: true });
        card.addEventListener('touchcancel', end, { passive: true });
        // 滑完在松手点补发的 click 别被当成「选了这一天」：只吞松手点附近那一次，350ms 自己过期
        card.addEventListener('click', ev => {
            if (Date.now() >= dpc.guard) return;
            if (Math.abs(ev.clientX - dpc.gx) > 24 || Math.abs(ev.clientY - dpc.gy) > 24) return;
            dpc.guard = 0; ev.stopPropagation(); ev.preventDefault();
        }, true);
    }

    function initKeyboardFix() {
        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                setTimeout(() => {
                    this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            });
            // 这些框填的都是时长/时刻，不会有负数和科学计数法；number 框默认放行 - + e
            input.addEventListener('keydown', e => {
                if (e.key === '-' || e.key === '+' || e.key === 'e' || e.key === 'E') e.preventDefault();
            });
        });
    }

    // 日期弹窗：点遮罩或按 Esc 关闭（等同「取消」），以及弹窗打开时锁住背后的页面
    function setupModalBehavior() {
        const overlay = document.getElementById('datePickerModal');
        const isOpen = () => overlay.classList.contains('show');

        // 按下和抬起都落在遮罩上才算「点遮罩」：从弹窗里按下拖到外面松手（比如选字）不该关
        let downOnOverlay = false;
        overlay.addEventListener('pointerdown', e => { downOnOverlay = (e.target === overlay); });
        overlay.addEventListener('click', e => {
            if (e.target === overlay && downOnOverlay) closeModal();
            downOnOverlay = false;
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen()) closeModal(); });

        // 遮罩本身不能滚，手指在它上面拖时浏览器会把滚动交给背后的整页——
        // 于是隔着弹窗也能滑动主界面。这里在遮罩层拦下：只有手指下面有容器
        // 「还能往这个方向滚」（年份下拉、矮屏上的弹窗本身）才放行，其余一律不滚。
        // 光看「能不能滚」不够：弹窗已经滚到顶还往下拉，浏览器照样把这一下交给背后的页面
        // （320×568 实测踩过）。而且滚动一开始，后续 touchmove 就取消不了了，所以每次都要判断。
        // 不用「给 body 设 position:fixed」那套锁法：会让吸顶导航条跳位
        // delta > 0 = 内容要往下滚（手指上滑 / 滚轮向下）
        function canScrollToward(el, delta) {
            for (; el && el !== overlay; el = el.parentElement) {
                const oy = getComputedStyle(el).overflowY;
                if ((oy !== 'auto' && oy !== 'scroll') || el.scrollHeight <= el.clientHeight) continue;
                if (delta > 0 && el.scrollTop + el.clientHeight < el.scrollHeight - 1) return true;
                if (delta < 0 && el.scrollTop > 0) return true;
            }
            return false;
        }
        // 按手指实际坐标取元素，不用 e.target：手指落在弹窗边缘外几像素时，浏览器会把触摸事件的
        // target「吸附」到附近的按钮上，但真正决定滚谁时用的是实际坐标（落在遮罩上 → 滚整页）
        let lastY = 0, startEl = null;
        overlay.addEventListener('touchstart', e => {
            const t = e.touches[0];
            lastY = t.clientY;
            startEl = document.elementFromPoint(t.clientX, t.clientY);
        }, { passive: true });
        overlay.addEventListener('touchmove', e => {
            const y = e.touches[0].clientY;
            const delta = lastY - y;
            lastY = y;
            if (delta === 0 || !isOpen()) return;   // 纯横向拖动不会带动页面（页面没有横向滚动）
            if (!canScrollToward(startEl, delta)) e.preventDefault();
        }, { passive: false });
        overlay.addEventListener('wheel', e => {
            if (isOpen() && !canScrollToward(e.target, e.deltaY)) e.preventDefault();
        }, { passive: false });
    }

    // ---- 下拉刷新时保住已填的内容 ----
    // 只在下拉刷新那一刻存、重新加载后读一次就删：平时打开页面仍是全新的「此刻」，
    // 不会把上次的旧时间一直带着。sessionStorage 关掉标签页就清
    const PTR_STATE_KEY = 'dc-ptr-state';
    const ADJUST_IDS = ['valY', 'valM', 'valW', 'valD', 'valh', 'valm', 'vals', 'valSleep'];
    const CONV_IDS = ['convY', 'convM', 'convW', 'convD', 'convH', 'convMin', 'convS', 'convCycle'];

    function savePageState() {
        const state = { dates: dates, mode: currentMode, lunar: lunarCardDate, inputs: {} };
        ADJUST_IDS.concat(CONV_IDS).forEach(id => { state.inputs[id] = document.getElementById(id).value; });
        try { sessionStorage.setItem(PTR_STATE_KEY, JSON.stringify(state)); } catch (err) {}
    }

    // 读到就恢复并返回 true；没有、读不了或内容不对就返回 false，按全新页面初始化
    function restorePageState() {
        let state = null;
        try {
            state = JSON.parse(sessionStorage.getItem(PTR_STATE_KEY));
            sessionStorage.removeItem(PTR_STATE_KEY);
        } catch (err) { return false; }
        if (!state || !state.dates || !state.inputs) return false;
        ADJUST_IDS.concat(CONV_IDS).forEach(id => {
            if (typeof state.inputs[id] === 'string') document.getElementById(id).value = state.inputs[id];
        });
        ['base', 'diffStart', 'diffEnd'].forEach(k => { dates[k] = state.dates[k] || null; });
        document.getElementById('baseTrigger').innerHTML = formatDateTimeHtml(dates.base, '请选择时间...');
        document.getElementById('diffStartTrigger').innerHTML = formatDateTimeHtml(dates.diffStart, '请选择开始时间...');
        document.getElementById('diffEndTrigger').innerHTML = formatDateTimeHtml(dates.diffEnd, '请选择结束时间...');
        setMode(state.mode === 'subtract' ? 'subtract' : 'add');   // 内含 calculate()
        calculateDiff();
        const l = state.lunar;
        if (l && inLunarRange(l.year, l.month, l.day)) setLunarCardDate(l.year, l.month, l.day);
        else setLunarToToday();
        return true;
    }

    // iOS Safari 专有的双指手势事件：拦掉就不缩放（其他浏览器没有这个事件，等于不生效）
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
        document.addEventListener(type, e => e.preventDefault(), { passive: false });
    });

    window.onload = () => {
        populateDropdowns();
        if (!restorePageState()) {
            setBaseToNow();
            setDiffStartToNow();
            setLunarToToday();
        }
        setupSectionNav();
        initKeyboardFix();
        setupModalBehavior();
        setupMonthSwipe();
        setupStepperRepeat();
        setupTimeWheels();
        setupWheelKeyboard();
        setupPullToRefresh();
        document.addEventListener('click', closeLunarMenus);
    };
</script>
