<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日期推算与换算 (Pro Max 终极大满贯版)</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --text-secondary: #8E8E93;
            --accent-color: #007AFF;
            --segment-bg: #E3E3E8;
            --input-bg: #F2F2F7;
            --shadow-color: rgba(0, 0, 0, 0.06);
            --modal-overlay: rgba(0, 0, 0, 0.4);
            --modal-bg-light: rgba(255, 255, 255, 0.85);
            --modal-bg-dark: rgba(30, 30, 30, 0.85);
            --danger-color: #FF3B30;
            --danger-bg: rgba(255, 59, 48, 0.1);
            --dropdown-bg: rgba(255, 255, 255, 0.95);
            --dropdown-border: rgba(0, 0, 0, 0.05);
            --stepper-btn-active: rgba(0, 0, 0, 0.08);
            --scrollbar-thumb: rgba(0, 0, 0, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1C1C1E;
                --text-main: #FFFFFF;
                --text-secondary: #EBEBF599;
                --accent-color: #0A84FF;
                --segment-bg: #2C2C2E;
                --input-bg: #2C2C2E;
                --shadow-color: rgba(0, 0, 0, 0.3);
                --modal-overlay: rgba(0, 0, 0, 0.6);
                --dropdown-bg: rgba(40, 40, 40, 0.95);
                --dropdown-border: rgba(255, 255, 255, 0.1);
                --stepper-btn-active: rgba(255, 255, 255, 0.15);
                --scrollbar-thumb: rgba(255, 255, 255, 0.25);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px 16px; display: flex; justify-content: center; min-height: 100vh; min-height: 100dvh; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 80px; }

        h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 4px; }

        .real-time-badge { background-color: var(--card-bg); color: var(--text-main); padding: 10px 16px; border-radius: 20px; text-align: center; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px var(--shadow-color); align-self: center; }
        .real-time-badge span { color: var(--accent-color); font-variant-numeric: tabular-nums; }

        .card { background-color: var(--card-bg); border-radius: 20px; padding: 20px 16px; box-shadow: 0 8px 24px var(--shadow-color); }
        
        /* 标题行：允许换行，宁可按钮掉到第二行也不能把卡片撞出横向滚动 */
        .section-header { display: flex; justify-content: space-between; align-items: center;
                          flex-wrap: wrap; gap: 8px 12px; margin-bottom: 16px; }
        /* 标题要能管住它自己的内容：原本 14px/600/灰，跟卡片内的 .input-label（13px/600/灰）
           几乎一模一样，层级是倒挂的。字号随视口伸缩，不按某一个宽度写死 */
        .section-title { font-size: clamp(15px, 4.2vw, 17px); font-weight: 800; color: var(--text-main);
                         letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px;
                         min-width: 0; }
        /* 左页边的起点标记：五个模块竖着堆、没有导航，滑到哪靠它认位置。
           渐变用的是结果卡片同一条（accent → #5E5CE6），不引新颜色 */
        .section-title::before { content: ""; width: 4px; height: 1.05em; border-radius: 2px; flex: none;
                                 background: linear-gradient(180deg, var(--accent-color), #5E5CE6); }
        
        .btn-section-reset { background-color: rgba(142, 142, 147, 0.15); color: var(--accent-color); border: none; padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; gap: 4px; }
        .btn-section-reset:active { background-color: rgba(142, 142, 147, 0.25); }

        .input-label { font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; display: block; }
        
        .custom-datetime-trigger { width: 100%; padding: 16px; font-size: 18px; font-weight: 600; border-radius: 14px; background-color: var(--input-bg); color: var(--text-main); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: opacity 0.2s; }
        .custom-datetime-trigger:active { opacity: 0.7; }
        .placeholder { color: var(--text-secondary); font-weight: 400; }

        .action-row { display: flex; gap: 12px; }
        .btn-half { flex: 1; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; transition: background-color 0.2s; }
        .btn-clear { background-color: var(--danger-bg); color: var(--danger-color); }
        .btn-now { background-color: rgba(0, 122, 255, 0.1); color: var(--accent-color); }
        .btn-half:active { filter: brightness(0.9); }

        .segmented-control { display: flex; background-color: var(--segment-bg); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .segment { flex: 1; text-align: center; padding: 10px 0; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 10px; color: var(--text-secondary); transition: all 0.25s; }
        .segment.active { background-color: var(--card-bg); color: var(--text-main); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

        .duration-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .convert-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        .stepper-group { display: flex; flex-direction: column; align-items: center; }
        .stepper-group label { font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; }

        /* 睡眠周期跟年月日时分秒不是同一量纲，单独占满一行并标注换算关系 */
        .sleep-cycle-group { grid-column: 1 / -1; margin-top: 4px; }
        .sleep-cycle-group label { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .sleep-hint { font-size: 12px; font-weight: 500; color: var(--text-secondary); opacity: 0.75; }
        .sleep-total { font-size: 12px; font-weight: 600; color: var(--accent-color); margin-top: 6px; min-height: 16px; }
        
        .stepper-control { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 12px; width: 100%; height: 44px; overflow: hidden; transition: box-shadow 0.2s; }
        .stepper-control:focus-within { box-shadow: 0 0 0 2px var(--accent-color); }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none !important; margin: 0 !important; }
        input[type="number"] { -moz-appearance: textfield !important; }
        
        .stepper-control input { flex: 1; width: 100%; min-width: 0; text-align: center; font-size: 16px; font-weight: 700; border: none; background: transparent; color: var(--text-main); outline: none; padding: 0; font-variant-numeric: tabular-nums; }
        .stepper-btn { width: 28px; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 600; color: var(--accent-color); background: transparent; border: none; cursor: pointer; transition: background-color 0.15s; padding: 0; }
        .stepper-btn:active { background-color: var(--stepper-btn-active); }

        .convert-control { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 12px; width: 100%; height: 44px; overflow: hidden; transition: box-shadow 0.2s; }
        .convert-control:focus-within { box-shadow: 0 0 0 2px var(--accent-color); }
        .convert-control input { flex: 1; width: 100%; min-width: 0; text-align: center; font-size: 18px; font-weight: 700; border: none; background: transparent; color: var(--text-main); outline: none; padding: 0 8px; font-variant-numeric: tabular-nums; }

        .result-card { text-align: center; padding: 24px 16px; background: linear-gradient(135deg, var(--accent-color), #5E5CE6); color: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 122, 255, 0.3); }
        .result-label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; font-weight: 500; }
        .result-value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.4; }

        /* ================= 核心修复：折合总计数据看板防偏移 ================= */
        .diff-totals-grid { 
            display: none;
            /* 强制绝对等分 3 列，无视内部文字多宽，确保绝对居中 */
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            gap: 8px; 
            margin-top: 20px; 
            padding-top: 20px; 
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .diff-total-item { 
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px; 
            padding: 8px 2px; /* 压缩 padding，为数字腾空间 */
            display: flex;
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden; /* 防止溢出边界 */
        }
        .diff-total-label { 
            font-size: 11px;
            opacity: 0.85; 
            margin-bottom: 4px; 
            font-weight: 500; 
            white-space: nowrap; /* 强制标题不换行 */
            transform: scale(0.95);
            /* 缩放防拥挤 */
        }
        .diff-total-val { 
            font-size: 14px;
            /* 字号略微调小保证长数字能放下 */
            font-weight: 700; 
            font-variant-numeric: tabular-nums; 
            width: 100%;
            text-align: center; 
            word-wrap: break-word; /* 极其长的数字允许换行 */
        }

        /* ================= iOS 风格自定义日期选择器 ================= */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background-color: var(--modal-overlay); display: flex; justify-content: center; align-items: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .ios-picker { width: 90%; max-width: 360px; max-height: 94dvh; overflow-y: auto; overscroll-behavior: none; background: var(--modal-bg-light); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); border-radius: 24px; padding: 16px 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid var(--dropdown-border); scrollbar-width: none; }
        .ios-picker::-webkit-scrollbar { display: none; }
        .modal-overlay.show .ios-picker { transform: scale(1); }

        .picker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: relative; z-index: 10; }
        .dropdown-group { display: flex; gap: 6px; align-items: center; }
        
        .custom-select { position: relative; }
        .select-btn { background: rgba(142, 142, 147, 0.12); padding: 4px 8px; border-radius: 8px; font-size: 17px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 4px; cursor: pointer; transition: background 0.2s; }
        .select-btn:active { background: rgba(142, 142, 147, 0.25); }
        .select-btn::after { content: "▾"; font-size: 14px; color: var(--text-secondary); }

        .select-menu { position: absolute; top: calc(100% + 8px); left: 0; background: var(--dropdown-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--dropdown-border); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); max-height: 200px; overflow-y: auto; overflow-x: hidden; min-width: 100px; z-index: 100; opacity: 0; pointer-events: none; transform: translateY(-10px) scale(0.95); transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
        .select-menu.show { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
        .select-menu::-webkit-scrollbar { width: 5px; }
        .select-menu::-webkit-scrollbar-track { background: transparent; margin: 6px 0; }
        .select-menu::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); border-radius: 10px; }
        
        .select-item { padding: 10px 16px; font-size: 16px; font-weight: 500; text-align: center; color: var(--text-main); border-bottom: 1px solid var(--dropdown-border); cursor: pointer; transition: background 0.1s; }
        .select-item:last-child { border-bottom: none; }
        .select-item:active { background: var(--segment-bg); }
        .select-item.selected { color: var(--accent-color); font-weight: 700; background: rgba(0, 122, 255, 0.08); }

        .btn-today-modal { background-color: rgba(0, 122, 255, 0.1); color: var(--accent-color); border: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        .btn-today-modal:active { background-color: rgba(0, 122, 255, 0.2); }

        .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 4px; position: relative; z-index: 1; }
        .weekdays span { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-bottom: 6px; }
        .days div { height: 36px; display: flex; justify-content: center; align-items: center; font-size: 17px; font-weight: 500; border-radius: 50%; cursor: pointer; transition: background-color 0.2s; }
        .days div:active { background-color: var(--segment-bg); }
        .days div.empty { cursor: default; }
        .days div.selected { background-color: var(--accent-color); color: white; font-weight: 700; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
        .days div.today:not(.selected) { color: var(--accent-color); font-weight: 700; }

        .time-picker-header { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(142, 142, 147, 0.2); }
        .time-picker-title { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
        .btn-time-zero { background-color: rgba(142, 142, 147, 0.15); color: var(--text-secondary); border: none; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-time-zero:active { background-color: rgba(142, 142, 147, 0.25); color: var(--text-main); }

        .time-picker { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .modal-time-stepper { display: flex; flex-direction: column; align-items: center; background: var(--input-bg); border-radius: 12px; width: 60px; overflow: hidden; }
        .modal-time-btn { width: 100%; height: 26px; display: flex; justify-content: center; align-items: center; color: var(--text-secondary); cursor: pointer; transition: background-color 0.1s; }
        .modal-time-btn:active { background-color: var(--stepper-btn-active); color: var(--text-main); }
        .modal-time-btn svg { width: 16px; height: 16px; }
        .modal-time-stepper input { width: 100%; height: 32px; text-align: center; font-size: 20px; font-weight: 700; background: transparent; border: none; color: var(--text-main); outline: none; padding: 0; min-width: 0; }
        .time-colon { font-size: 18px; font-weight: 700; color: var(--text-secondary); padding-bottom: 2px; }

        .picker-actions { display: flex; gap: 12px; margin-top: 16px; }
        .picker-btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
        .btn-cancel-modal { background-color: var(--input-bg); color: var(--text-main); }
        .btn-done-modal { background-color: var(--accent-color); color: white; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }

        /* ================= 下拉刷新 ================= */
        /* 先关掉浏览器自带的下拉刷新，否则会和自研的这套同时触发 */
        html, body { overscroll-behavior-y: contain; }

        #ptrIndicator {
            position: fixed;
            top: calc(-44px + env(safe-area-inset-top, 0px));
            left: 50%;
            margin-left: -18px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background-color: var(--card-bg);
            box-shadow: 0 4px 14px var(--shadow-color);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-color);
            opacity: 0;
            pointer-events: none;
            z-index: 1200;
        }
        /* 跟手过程中必须关掉过渡，只在松手回弹时开，否则拖泥带水 */
        #ptrIndicator.ptr-animate { transition: transform 0.25s ease, opacity 0.25s ease; }
        #ptrIndicator svg { width: 20px; height: 20px; }
        #ptrIndicator .ptr-arrow { transition: transform 0.2s ease; }
        #ptrIndicator.ptr-ready .ptr-arrow { transform: rotate(180deg); }
        #ptrIndicator .ptr-spinner { display: none; }
        #ptrIndicator.ptr-loading .ptr-arrow { display: none; }
        #ptrIndicator.ptr-loading .ptr-spinner { display: block; animation: ptr-spin 0.8s linear infinite; }
        @keyframes ptr-spin { to { transform: rotate(360deg); } }

        /* ================= 公历 ⇄ 农历 ================= */
        .lunar-line {
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 4px 6px;
            background-color: var(--input-bg);
            border-radius: 14px;
            padding: 8px 6px;
        }
        .lunar-line .select-btn {
            min-height: 44px;                 /* 触摸目标不小于 44px */
            padding: 8px 10px;
            border-radius: 10px;
            background-color: var(--card-bg);
            font-size: clamp(15px, 4.2vw, 17px);
        }
        .lunar-line .select-item { padding: 11px 16px; }
        .lunar-line .select-menu { min-width: 120px; }
        /* 菜单按各自在行内的位置定锚，防止最右侧那个把页面撑出横向滚动 */
        .lunar-anchor-l .select-menu { left: 0; right: auto; }
        .lunar-anchor-c .select-menu { left: 50%; right: auto; margin-left: -60px; }
        .lunar-anchor-r .select-menu { left: auto; right: 0; }
        .lunar-unit { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

        .lunar-arrow { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: var(--text-secondary); }
        .lunar-arrow::before, .lunar-arrow::after { content: ""; flex: 1; height: 1px; background-color: currentColor; opacity: 0.25; }
        .lunar-arrow svg { width: 18px; height: 18px; display: block; }

        .lunar-meta { font-size: 13px; opacity: 0.92; margin-top: 10px; font-weight: 500; line-height: 1.65; }
        .lunar-note { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: 12px; line-height: 1.5; }

        /* 过年快捷跳转：两个按钮平分整行，高度按 44px 触摸标准单独定，不复用 .btn-section-reset（那个只有 29px，且被另外三张卡片共用） */
        .lunar-quick { display: flex; gap: 10px; margin-top: 14px; }
        .btn-lunar-quick {
            flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px;
            background-color: rgba(142, 142, 147, 0.15); color: var(--accent-color); border: none;
            border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .btn-lunar-quick:active { background-color: rgba(142, 142, 147, 0.28); }
        .btn-lunar-quick:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-lunar-quick svg { width: 15px; height: 15px; flex: none; display: block; }

        /* 极窄屏（320~360）：只把尺寸压紧，不改成堆叠形态，让农历那一行仍然排得下 */
        @media (max-width: 22.5rem) {
            .lunar-line { gap: 3px 4px; padding: 8px 4px; }
            .lunar-line .select-btn { padding: 8px 7px; }
            .lunar-line .select-btn::after { font-size: 12px; }
            .lunar-unit { font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="ptrIndicator">
    <svg class="ptr-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    <svg class="ptr-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
</div>

<div class="container">
    <div class="real-time-badge">当前北京时间：<span id="realTimeClock">--</span></div>

    <div class="card">
        <div class="section-header" style="margin-bottom: 16px;">
            <div class="section-title">基准时间 (推算起点)</div>
        </div>
        
        <div class="custom-datetime-trigger" id="baseTrigger" onclick="openModal('base')">
            <span class="placeholder">请选择时间...</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>

        <div class="action-row">
            <button class="btn-half btn-clear" onclick="clearTime()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                清除
            </button>
            <button class="btn-half btn-now" onclick="setBaseToNow()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                当前时刻
            </button>
        </div>

        <div class="section-header" style="margin-top: 24px;">

<script>
    // ================= 核心状态管理 =================
    const dates = { base: null, diffStart: null, diffEnd: null };
    let currentMode = 'add';
    let currentModalTarget = 'base';
    
    let viewYear = 2026;
    let viewMonth = 3; 
    let selectedDay = 1;

    // ================= 基础工具 =================
    function getBeijingTimeObj() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: 'numeric', day: 'numeric',
            hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
        });
        const parts = formatter.formatToParts(now);
        const p = {};
        parts.forEach(part => p[part.type] = part.value);
        if (p.hour === '24') p.hour = '00';
        return {
            year: parseInt(p.year), month: parseInt(p.month), day: parseInt(p.day),
            hour: parseInt(p.hour), minute: parseInt(p.minute), second: parseInt(p.second)
        };
    }

    setInterval(() => {
        const bj = getBeijingTimeObj();
        document.getElementById('realTimeClock').textContent = 
            `${bj.year}-${String(bj.month).padStart(2,'0')}-${String(bj.day).padStart(2,'0')} ${String(bj.hour).padStart(2,'0')}:${String(bj.minute).padStart(2,'0')}:${String(bj.second).padStart(2,'0')}`;
    }, 1000);

    function formatDateTimeHtml(obj, placeholderText) {
        const svgIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;
        if (!obj) return `<span class="placeholder">${placeholderText}</span>` + svgIcon;
        const text = `${obj.year}年${String(obj.month).padStart(2,'0')}月${String(obj.day).padStart(2,'0')}日 ${String(obj.hour).padStart(2,'0')}:${String(obj.minute).padStart(2,'0')}:${String(obj.second).padStart(2,'0')}`;
        return `<span>${text}</span>` + svgIcon;
    }

    // ================= 模块一：日期推算控制 =================
    function setBaseToNow() {
        dates.base = getBeijingTimeObj();
        document.getElementById('baseTrigger').innerHTML = formatDateTimeHtml(dates.base, '请选择时间...');
        calculate();
    }

    function clearTime() {
        dates.base = null;
        document.getElementById('baseTrigger').innerHTML = formatDateTimeHtml(null, '请选择时间...');
        document.getElementById('resultDateTime').textContent = "--";
    }

    // 一个睡眠周期按 90 分钟计（通行的近似值，实际因人而异）
    const SLEEP_CYCLE_MINUTES = 90;

    function resetAdjustments() {
        const ids = ['valY', 'valM', 'valD', 'valh', 'valm', 'vals', 'valSleep'];
        ids.forEach(id => { document.getElementById(id).value = 0; });
        calculate();
    }

    function stepValue(id, delta) {
        const input = document.getElementById(id);
        let val = parseInt(input.value, 10);
        if (isNaN(val)) val = 0;
        val += delta;
        if (val < 0) val = 0;
        input.value = val;
        calculate(); 
    }

    // 把周期数换算成小时/分钟显示在步进器下方，省得心算 90 的倍数
    function updateSleepTotal() {
        const el = document.getElementById('sleepTotal');
        if (!el) return;
        const cycles = getVal('valSleep');
        if (cycles <= 0) { el.textContent = ''; return; }
        const totalMin = cycles * SLEEP_CYCLE_MINUTES;
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        const sign = currentMode === 'add' ? '+' : '−';
        el.textContent = `${sign} ${cycles} 个周期 = ${h} 小时${m ? ` ${m} 分钟` : ''}`;
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeAdd').classList.remove('active');
        document.getElementById('modeSub').classList.remove('active');
        document.getElementById(mode === 'add' ? 'modeAdd' : 'modeSub').classList.add('active');
        calculate();
    }

    function getVal(id) { const val = parseInt(document.getElementById(id).value, 10); return isNaN(val) ? 0 : val; }

    function calculate() {
        updateSleepTotal();
        if (!dates.base) { document.getElementById('resultDateTime').textContent = "--";
        return; }
        let calcDate = new Date(Date.UTC(dates.base.year, dates.base.month - 1, dates.base.day, dates.base.hour, dates.base.minute, dates.base.second));
        let multi = currentMode === 'add' ? 1 : -1;
        calcDate.setUTCFullYear(calcDate.getUTCFullYear() + (getVal('valY') * multi));
        calcDate.setUTCMonth(calcDate.getUTCMonth() + (getVal('valM') * multi));
        calcDate.setUTCDate(calcDate.getUTCDate() + (getVal('valD') * multi));
        calcDate.setUTCHours(calcDate.getUTCHours() + (getVal('valh') * multi));
        calcDate.setUTCMinutes(calcDate.getUTCMinutes() + (getVal('valm') * multi));
        calcDate.setUTCSeconds(calcDate.getUTCSeconds() + (getVal('vals') * multi));
        calcDate.setUTCMinutes(calcDate.getUTCMinutes() + (getVal('valSleep') * SLEEP_CYCLE_MINUTES * multi));
        const outYear = calcDate.getUTCFullYear();
        const outMonth = String(calcDate.getUTCMonth() + 1).padStart(2, '0');
        const outDay = String(calcDate.getUTCDate()).padStart(2, '0');
        const outHour = String(calcDate.getUTCHours()).padStart(2, '0');
        const outMin = String(calcDate.getUTCMinutes()).padStart(2, '0');
        const outSec = String(calcDate.getUTCSeconds()).padStart(2, '0');

        document.getElementById('resultDateTime').textContent = `${outYear}年${outMonth}月${outDay}日 ${outHour}:${outMin}:${outSec}`;
    }

    // ================= 模块二：日期间隔计算新增/修改功能 =================
    
    // 给右上角按钮使用：将开始和结束时间都设置为当前时刻
    function setBothDiffToNow() {
        const now = getBeijingTimeObj();
        dates.diffStart = {...now};
        dates.diffEnd = {...now};
        document.getElementById('diffStartTrigger').innerHTML = formatDateTimeHtml(dates.diffStart, '请选择开始时间...');
        document.getElementById('diffEndTrigger').innerHTML = formatDateTimeHtml(dates.diffEnd, '请选择结束时间...');
        calculateDiff();
    }

    // 给开始时间大按钮使用：仅将开始时间设置为当前时刻
    function setDiffStartToNow() {
        dates.diffStart = getBeijingTimeObj();
        document.getElementById('diffStartTrigger').innerHTML = formatDateTimeHtml(dates.diffStart, '请选择开始时间...');
        calculateDiff();
    }

    // 给开始时间大按钮使用：仅清除开始时间
    function clearDiffStart() {
        dates.diffStart = null;
        document.getElementById('diffStartTrigger').innerHTML = formatDateTimeHtml(null, '请选择开始时间...');
        calculateDiff();
    }

    function clearDiff() {
        dates.diffStart = null;
        dates.diffEnd = null;
        document.getElementById('diffStartTrigger').innerHTML = formatDateTimeHtml(null, '请选择开始时间...');
        document.getElementById('diffEndTrigger').innerHTML = formatDateTimeHtml(null, '请选择结束时间...');
        document.getElementById('diffResultValue').textContent = "--";
        document.getElementById('diffTotalsGrid').style.display = 'none';
    }

    function calculateDiff() {
        if (!dates.diffStart || !dates.diffEnd) {
            document.getElementById('diffResultValue').textContent = "--";
            document.getElementById('diffTotalsGrid').style.display = 'none';
            return;
        }

        let start = dates.diffStart;
        let end = dates.diffEnd;
        let isNegative = false;

        let d1 = new Date(Date.UTC(start.year, start.month-1, start.day, start.hour, start.minute, start.second));
        let d2 = new Date(Date.UTC(end.year, end.month-1, end.day, end.hour, end.minute, end.second));

        let calcStart = {...start};
        let calcEnd = {...end};
        if (d1 > d2) {
            calcStart = {...end};
            calcEnd = {...start};
            isNegative = true;
        }

        let years = calcEnd.year - calcStart.year;
        let months = calcEnd.month - calcStart.month;
        let days = calcEnd.day - calcStart.day;
        let hours = calcEnd.hour - calcStart.hour;
        let minutes = calcEnd.minute - calcStart.minute;
        let seconds = calcEnd.second - calcStart.second;

        if (seconds < 0) { seconds += 60; minutes -= 1; }
        if (minutes < 0) { minutes += 60; hours -= 1; }
        if (hours < 0) { hours += 24; days -= 1; }
        if (days < 0) {
            let prevMonth = calcEnd.month - 1;
            let prevYear = calcEnd.year;
            if (prevMonth === 0) { prevMonth = 12; prevYear -= 1; }
            let daysInPrevMonth = new Date(Date.UTC(prevYear, prevMonth, 0)).getUTCDate();
            days += daysInPrevMonth;
            months -= 1;
        }
        if (months < 0) { months += 12; years -= 1; }

        const allUnits = [
            { val: years, name: '年' },
            { val: months, name: '个月' },
            { val: days, name: '天' },
            { val: hours, name: '小时' },
            { val: minutes, name: '分钟' },
            { val: seconds, name: '秒' }
        ];
        let firstNonZero = -1;
        for (let i = 0; i < allUnits.length; i++) {
            if (allUnits[i].val > 0) {
                if (firstNonZero === -1) firstNonZero = i;
            }
        }

        let fullStr = "";
        let prefix = isNegative ? "相差(反向) " : "相差 ";
        if (firstNonZero === -1) {
            fullStr = "时间完全相同";
            prefix = "";
        } else {
            let parts = [];
            for (let i = firstNonZero; i <= 5; i++) {
                parts.push(`${allUnits[i].val}${allUnits[i].name}`);
            }
            fullStr = parts.join('');
        }

        document.getElementById('diffResultValue').textContent = prefix + fullStr;

        let diffMs = Math.abs(d2.getTime() - d1.getTime());
        let totS = diffMs / 1000;
        let totMin = totS / 60;
        let totH = totMin / 60;
        let totD = totH / 24;
        let totM = totD / 30.4166667; 
        let totY = totD / 365;
        const fmt = val => parseFloat(val.toFixed(3));

        document.getElementById('totS').textContent = fmt(totS);
        document.getElementById('totMin').textContent = fmt(totMin);
        document.getElementById('totH').textContent = fmt(totH);
        document.getElementById('totD').textContent = fmt(totD);
        document.getElementById('totM').textContent = fmt(totM);
        document.getElementById('totY').textContent = fmt(totY);

        document.getElementById('diffTotalsGrid').style.display = 'grid';
    }

    // ================= 模块三：全自动换算器 =================
    const CONV_RATES = {
        Y: 31536000,
        M: 2628000,
        W: 604800,
        D: 86400,
        H: 3600,
        Min: 60,
        S: 1,
        Cycle: 5400
    };
    function runConversion(sourceUnit) {
        const inputStr = document.getElementById('conv' + sourceUnit).value;
        let val = parseFloat(inputStr);
        if (isNaN(val)) val = 0;

        let baseSeconds = val * CONV_RATES[sourceUnit];
        const units = ['Y', 'M', 'W', 'D', 'H', 'Min', 'S', 'Cycle'];
        units.forEach(unit => {
            if (unit !== sourceUnit) {
                let converted = baseSeconds / CONV_RATES[unit];
                let formatted = parseFloat(converted.toFixed(5)); 
                document.getElementById('conv' + unit).value = formatted;
            }
        });
    }

    function resetConverter() {
        const units = ['Y', 'M', 'W', 'D', 'H', 'Min', 'S', 'Cycle'];
        units.forEach(unit => { document.getElementById('conv' + unit).value = 0; });
    }

    // ================= 模块四：公历 ⇄ 农历 =================
    /* ================= 农历数据表（农历 1901 - 2100 年）=================
       每年一个整数，索引 0 对应农历 1901 年：
         bit 0-3   闰月月号（0 = 该年无闰月）
         bit 4-16  该年 12 或 13 个月的大小月，第 i 位为 1 表示第 i 个月是大月(30 天)
         bit 17-22 正月初一距该公历年 1 月 1 日的天数偏移
       数据源：香港天文台《公曆與農曆日期對照表》1901-2100 逐日文本
       https://www.hko.gov.hk/tc/gts/time/conversion.htm
       （农历 2100 年腊月只有初一落在 2100 年内，其月长取自 ICU chinese 历法）
       生成后已与该对照表全区间逐日比对，无差异。 */
    const LUNAR_TABLE = [
        0x627520,0x4cea50,0x3964a5,0x5c64b0,0x44a9b0,0x315564,0x5656a0,0x40b590,0x2b7522,0x507520,
        0x3bb256,0x60b250,0x48a4b0,0x334ab5,0x582ad0,0x4256b0,0x2cb692,0x52da90,0x3fd927,0x64e920,
        0x4cd250,0x37a4d5,0x5ca560,0x462b60,0x2f5b54,0x566d40,0x40ea90,0x2de922,0x50e920,0x3ad266,
        0x5e52b0,0x48a570,0x332b65,0x58b5a0,0x446d40,0x2eec93,0x527490,0x3d6937,0x62a930,0x4c52b0,
        0x34a5b6,0x5aaad0,0x4656a0,0x31b554,0x56ba40,0x40b490,0x2ba932,0x50a950,0x3952d7,0x5e5360,
        0x48aad0,0x355aa5,0x585b20,0x42da50,0x2fd4a3,0x54d4a0,0x3ca958,0x60a970,0x4c5560,0x36ab56,
        0x5aad50,0x466d20,0x30ea54,0x56ea50,0x4064a0,0x28c973,0x4ea9b0,0x3b55a7,0x5e56a0,0x48b690,
        0x357525,0x5ab520,0x42b250,0x2d64b4,0x52a4b0,0x3d4ab8,0x602ad0,0x4a56d0,0x36b696,0x5cda90,
        0x46d920,0x31d254,0x56d250,0x41a4da,0x64a560,0x4e2b60,0x385b56,0x5e6d50,0x48ea90,0x35e925,
        0x5ae920,0x44d260,0x2ca563,0x50a570,0x3d4d68,0x6235a0,0x4a6d50,0x376c95,0x5c7490,0x466930,
        0x2f52b4,0x5452b0,0x3ea5b0,0x2b55a2,0x4e56a0,0x39b557,0x60ba40,0x4ab490,0x33a935,0x58a950,
        0x4252d0,0x2caad4,0x50ab50,0x3d5aa9,0x625d20,0x4cda50,0x37d4a6,0x5cd4a0,0x46c950,0x3152e4,
        0x545560,0x3eab50,0x2b5b22,0x506d20,0x38ea56,0x5e7250,0x4864b0,0x32c975,0x56cab0,0x4255a0,
        0x2cad63,0x52b690,0x3d752b,0x62b520,0x4cb250,0x37a4b6,0x5aa4b0,0x444ab0,0x2e55b5,0x545ad0,
        0x3eb6a0,0x2bb522,0x50d920,0x3bd257,0x5ed250,0x48a550,0x334ad5,0x584b60,0x405b50,0x2cdaa3,
        0x52ec90,0x3fe928,0x62e920,0x4cd260,0x36a566,0x5aa570,0x445560,0x2e6d54,0x547550,0x407490,
        0x28e933,0x4e6930,0x3952b7,0x5e52b0,0x46a5b0,0x3355a5,0x5856a0,0x42b650,0x2d74a4,0x52b4a0,
        0x3da958,0x62a950,0x4a52d0,0x34aad6,0x5aab50,0x465aa0,0x2eba54,0x54da50,0x40d4a0,0x2bc953,
        0x4ec960,0x3994e7,0x5e5560,0x48ab50,0x335b25,0x586d20,0x42ea50,0x2ee4a4,0x5068b0,0x3ac978,
        0x604ab0,0x4a55b0,0x34ad66,0x5ab6a0,0x467520,0x317254,0x54b450,0x3ea8b0,0x2949b2,0x4e4ab0
    ];
    const LUNAR_MIN_YEAR = 1901;
    const LUNAR_MAX_YEAR = LUNAR_MIN_YEAR + LUNAR_TABLE.length - 1;
    const MS_PER_DAY = 86400000;

    const HEAVENLY_STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    const EARTHLY_BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const ZODIACS = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    const LUNAR_MONTH_NAMES = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
    const LUNAR_DAY_TENS = ['初','十','廿','三'];
    const LUNAR_DIGITS = ['〇','一','二','三','四','五','六','七','八','九'];
    const WEEKDAY_CN = ['日','一','二','三','四','五','六'];

    // 取某农历年的结构：闰月号、逐月天数、正月初一对应的 UTC 毫秒
    function getLunarYearInfo(lunarYear) {
        const raw = LUNAR_TABLE[lunarYear - LUNAR_MIN_YEAR];
        if (raw === undefined) return null;
        const leapMonth = raw & 0xF;
        const sizeBits = (raw >> 4) & 0x1FFF;
        const newYearOffset = (raw >> 17) & 0x3F;
        const monthCount = leapMonth ? 13 : 12;
        const monthDays = [];
        for (let i = 0; i < monthCount; i++) monthDays.push(((sizeBits >> i) & 1) ? 30 : 29);
        return {
            year: lunarYear,
            leapMonth: leapMonth,
            monthDays: monthDays,
            newYearMs: Date.UTC(lunarYear, 0, 1) + newYearOffset * MS_PER_DAY
        };
    }

    // 农历「几月」在该年月序里的下标；该年没有这个闰月时返回 -1
    function lunarMonthIndex(info, month, isLeap) {
        if (!info || month < 1 || month > 12) return -1;
        if (isLeap) return info.leapMonth === month ? month : -1;
        if (!info.leapMonth || month <= info.leapMonth) return month - 1;
        return month;
    }

    // 公历 → 农历。超出数据表范围返回 null
    function solarToLunar(year, month, day) {
        const ms = Date.UTC(year, month - 1, day);
        let info = getLunarYearInfo(year);
        if (!info || ms < info.newYearMs) info = getLunarYearInfo(year - 1);
        if (!info || ms < info.newYearMs) return null;
        let offset = Math.round((ms - info.newYearMs) / MS_PER_DAY);
        let idx = 0;
        while (idx < info.monthDays.length && offset >= info.monthDays[idx]) {
            offset -= info.monthDays[idx];
            idx++;
        }
        if (idx >= info.monthDays.length) return null;
        let lunarMonth, isLeap;
        if (!info.leapMonth || idx < info.leapMonth) { lunarMonth = idx + 1; isLeap = false; }
        else if (idx === info.leapMonth) { lunarMonth = info.leapMonth; isLeap = true; }
        else { lunarMonth = idx; isLeap = false; }
        return { year: info.year, month: lunarMonth, isLeap: isLeap, day: offset + 1 };
    }

    // 农历 → 公历。闰月不存在或日期越界返回 null
    function lunarToSolar(lunarYear, lunarMonth, isLeap, lunarDay) {
        const info = getLunarYearInfo(lunarYear);
        const idx = lunarMonthIndex(info, lunarMonth, isLeap);
        if (idx < 0) return null;
        if (!(lunarDay >= 1 && lunarDay <= info.monthDays[idx])) return null;
        let offset = 0;
        for (let i = 0; i < idx; i++) offset += info.monthDays[i];
        const d = new Date(info.newYearMs + (offset + lunarDay - 1) * MS_PER_DAY);
        return { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1, day: d.getUTCDate() };
    }

    // 干支年 / 生肖：以公元 1984 年（农历甲子年）为基准，均在正月初一换年
    function ganzhiOfLunarYear(lunarYear) {
        const n = (((lunarYear - 1984) % 60) + 60) % 60;
        return HEAVENLY_STEMS[n % 10] + EARTHLY_BRANCHES[n % 12];
    }
    function zodiacOfLunarYear(lunarYear) {
        return ZODIACS[(((lunarYear - 1984) % 12) + 12) % 12];
    }

    function lunarYearToChinese(y) {
        return String(y).split('').map(function (c) { return LUNAR_DIGITS[+c]; }).join('');
    }
    function lunarMonthToChinese(month, isLeap) {
        return (isLeap ? '闰' : '') + LUNAR_MONTH_NAMES[month - 1] + '月';
    }
    function lunarDayToChinese(day) {
        if (day === 10) return '初十';
        if (day === 20) return '二十';
        if (day === 30) return '三十';
        return LUNAR_DAY_TENS[Math.floor(day / 10)] + LUNAR_DIGITS[day % 10];
    }
    function solarWeekdayCn(y, m, d) {
        return WEEKDAY_CN[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
    }
    function daysInSolarMonth(y, m) {
        return new Date(Date.UTC(y, m, 0)).getUTCDate();
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    // 数据表支持的公历区间（由表本身推出，不写死）
    const LUNAR_RANGE = (function () {
        const firstInfo = getLunarYearInfo(LUNAR_MIN_YEAR);
        const lastInfo = getLunarYearInfo(LUNAR_MAX_YEAR);
        let total = 0;
        for (let i = 0; i < lastInfo.monthDays.length; i++) total += lastInfo.monthDays[i];
        const minMs = firstInfo.newYearMs;
        const maxMs = lastInfo.newYearMs + (total - 1) * MS_PER_DAY;
        const a = new Date(minMs), b = new Date(maxMs);
        return {
            minMs: minMs, maxMs: maxMs,
            minYear: a.getUTCFullYear(), maxYear: b.getUTCFullYear(),
            minText: a.getUTCFullYear() + '-' + pad2(a.getUTCMonth() + 1) + '-' + pad2(a.getUTCDate()),
            maxText: b.getUTCFullYear() + '-' + pad2(b.getUTCMonth() + 1) + '-' + pad2(b.getUTCDate())
        };
    })();

    function inLunarRange(y, m, d) {
        const ms = Date.UTC(y, m - 1, d);
        return ms >= LUNAR_RANGE.minMs && ms <= LUNAR_RANGE.maxMs;
    }
    // 只列出落在支持区间内的月/日，让界面上根本选不出非法组合
    function solarMonthChoices(y) {
        const list = [];
        for (let m = 1; m <= 12; m++) {
            if (inLunarRange(y, m, 1) || inLunarRange(y, m, daysInSolarMonth(y, m))) list.push(m);
        }
        return list;
    }
    function solarDayChoices(y, m) {
        const list = [];
        const n = daysInSolarMonth(y, m);
        for (let d = 1; d <= n; d++) if (inLunarRange(y, m, d)) list.push(d);
        return list;
    }
    function nearestIn(list, v) {
        let best = list[0];
        for (let i = 1; i < list.length; i++) {
            if (Math.abs(list[i] - v) < Math.abs(best - v)) best = list[i];
        }
        return best;
    }

    // 只存公历这一份状态，农历侧完全由它推出，避免两边各存一份而对不上
    let lunarCardDate = null;

    function setLunarCardDate(y, m, d) {
        const months = solarMonthChoices(y);
        if (months.indexOf(m) < 0) m = nearestIn(months, m);
        const days = solarDayChoices(y, m);
        if (days.indexOf(d) < 0) d = nearestIn(days, d);
        lunarCardDate = { year: y, month: m, day: d };
        renderLunarCard();
    }

    function setLunarToToday() {
        const bj = getBeijingTimeObj();
        setLunarCardDate(bj.year, bj.month, bj.day);
    }

    // ---- 过年快捷跳转 ----
    // 春节 = 农历正月初一；除夕一律用「初一减一天」推，不去查腊月三十
    //（腊月可能只有廿九，2027 年的除夕就是腊月廿九，查三十会落空）
    function springFestivalSolar(lunarYear) {
        return lunarToSolar(lunarYear, 1, false, 1);
    }
    // 找 ≥ 基准日的最近一个春节/除夕；算出来越出数据表区间就返回 null
    // 春节落在公历 1 月 21 日 ~ 2 月 21 日之间，除夕最早也只到 1 月 20 日，
    // 所以农历年号和它们所在的公历年号总是同一个，从 fromY 起找即可
    function nextSpringFestival(kind, fromY, fromM, fromD) {
        const fromMs = Date.UTC(fromY, fromM - 1, fromD);
        for (let ly = fromY; ly <= LUNAR_MAX_YEAR; ly++) {
            const s = springFestivalSolar(ly);
            if (!s) continue;
            let ms = Date.UTC(s.year, s.month - 1, s.day);
            if (kind === 'eve') ms -= MS_PER_DAY;
            if (ms < fromMs) continue;
            if (ms < LUNAR_RANGE.minMs || ms > LUNAR_RANGE.maxMs) return null;
            const d = new Date(ms);
            return { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1, day: d.getUTCDate() };
        }
        return null;
    }
    function jumpToSpringFestival(kind) {
        const bj = getBeijingTimeObj();
        const t = nextSpringFestival(kind, bj.year, bj.month, bj.day);
        if (!t) return;                       // 越界时按钮本来就是禁用态，这里再兜一层
        setLunarCardDate(t.year, t.month, t.day);
    }
    // 可用性只取决于「今天」，但仍挂在每次渲染上：页面跨年放着不关也不会算错
    function refreshLunarQuickButtons() {
        const bj = getBeijingTimeObj();
        document.getElementById('btnLunarEve').disabled = !nextSpringFestival('eve', bj.year, bj.month, bj.day);
        document.getElementById('btnLunarNewYear').disabled = !nextSpringFestival('day', bj.year, bj.month, bj.day);
    }

    function pickSolarYear(key) { setLunarCardDate(parseInt(key, 10), lunarCardDate.month, lunarCardDate.day); }
    function pickSolarMonth(key) { setLunarCardDate(lunarCardDate.year, parseInt(key, 10), lunarCardDate.day); }
    function pickSolarDay(key) { setLunarCardDate(lunarCardDate.year, lunarCardDate.month, parseInt(key, 10)); }

    function currentLunar() {
        return solarToLunar(lunarCardDate.year, lunarCardDate.month, lunarCardDate.day);
    }
    // 换年/换月之后原来的闰月或日子可能不存在了，就地收敛到最接近的合法值
    function applyLunar(lunarYear, month, isLeap, day) {
        const info = getLunarYearInfo(lunarYear);
        if (!info) return;
        let idx = lunarMonthIndex(info, month, isLeap);
        if (idx < 0) { isLeap = false; idx = lunarMonthIndex(info, month, false); }
        if (idx < 0) { month = 1; isLeap = false; idx = 0; }
        if (day > info.monthDays[idx]) day = info.monthDays[idx];
        if (day < 1) day = 1;
        const s = lunarToSolar(lunarYear, month, isLeap, day);
        if (s) setLunarCardDate(s.year, s.month, s.day);
    }
    function pickLunarYear(key) { const c = currentLunar(); applyLunar(parseInt(key, 10), c.month, c.isLeap, c.day); }
    function pickLunarMonth(key) {
        const c = currentLunar();
        const isLeap = key.charAt(0) === 'L';
        applyLunar(c.year, parseInt(isLeap ? key.slice(1) : key, 10), isLeap, c.day);
    }
    function pickLunarDay(key) { const c = currentLunar(); applyLunar(c.year, c.month, c.isLeap, parseInt(key, 10)); }

    function buildLunarMenu(menuId, items, currentKey, handlerName) {
        let html = '';
        for (let i = 0; i < items.length; i++) {
            const sel = items[i].key === currentKey ? ' selected' : '';
            html += '<div class="select-item' + sel + '" data-key="' + items[i].key + '" onclick="' +
                    handlerName + '(this.dataset.key)">' + items[i].label + '</div>';
        }
        document.getElementById(menuId).innerHTML = html;
    }

    function closeLunarMenus() {
        const menus = document.querySelectorAll('#lunarCard .select-menu.show');
        for (let i = 0; i < menus.length; i++) menus[i].classList.remove('show');
    }
    function toggleLunarMenu(event, menuId) {
        event.stopPropagation();
        const menu = document.getElementById(menuId);
        const showing = menu.classList.contains('show');
        closeLunarMenus();
        if (showing) return;
        menu.classList.add('show');
        const sel = menu.querySelector('.select-item.selected');
        // 只滚菜单自身：scrollIntoView 会把整页也一起带着跳
        if (sel) menu.scrollTop = sel.offsetTop - menu.clientHeight / 2 + sel.offsetHeight / 2;
    }

    function renderLunarCard() {
        const s = lunarCardDate;

        const yearItems = [];
        for (let y = LUNAR_RANGE.minYear; y <= LUNAR_RANGE.maxYear; y++) {
            yearItems.push({ key: String(y), label: String(y) });
        }
        buildLunarMenu('solarYearMenu', yearItems, String(s.year), 'pickSolarYear');

        const monthItems = solarMonthChoices(s.year).map(function (m) { return { key: String(m), label: String(m) }; });
        buildLunarMenu('solarMonthMenu', monthItems, String(s.month), 'pickSolarMonth');

        const dayItems = solarDayChoices(s.year, s.month).map(function (d) { return { key: String(d), label: String(d) }; });
        buildLunarMenu('solarDayMenu', dayItems, String(s.day), 'pickSolarDay');

        document.getElementById('solarYearDisplay').textContent = s.year;
        document.getElementById('solarMonthDisplay').textContent = s.month;
        document.getElementById('solarDayDisplay').textContent = s.day;

        const l = solarToLunar(s.year, s.month, s.day);
        const info = getLunarYearInfo(l.year);

        const lYearItems = [];
        for (let y = LUNAR_MIN_YEAR; y <= LUNAR_MAX_YEAR; y++) {
            lYearItems.push({ key: String(y), label: lunarYearToChinese(y) });
        }
        buildLunarMenu('lunarYearMenu', lYearItems, String(l.year), 'pickLunarYear');

        const lMonthItems = [];
        for (let m = 1; m <= 12; m++) {
            lMonthItems.push({ key: String(m), label: lunarMonthToChinese(m, false) });
            if (info.leapMonth === m) lMonthItems.push({ key: 'L' + m, label: lunarMonthToChinese(m, true) });
        }
        buildLunarMenu('lunarMonthMenu', lMonthItems, (l.isLeap ? 'L' : '') + l.month, 'pickLunarMonth');

        const idx = lunarMonthIndex(info, l.month, l.isLeap);
        const lDayItems = [];
        for (let d = 1; d <= info.monthDays[idx]; d++) {
            lDayItems.push({ key: String(d), label: lunarDayToChinese(d) });
        }
        buildLunarMenu('lunarDayMenu', lDayItems, String(l.day), 'pickLunarDay');

        document.getElementById('lunarYearDisplay').textContent = lunarYearToChinese(l.year);
        document.getElementById('lunarMonthDisplay').textContent = lunarMonthToChinese(l.month, l.isLeap);
        document.getElementById('lunarDayDisplay').textContent = lunarDayToChinese(l.day);

        document.getElementById('lunarResultValue').textContent =
            lunarYearToChinese(l.year) + '年' + lunarMonthToChinese(l.month, l.isLeap) + lunarDayToChinese(l.day);
        document.getElementById('lunarResultMeta').innerHTML =
            ganzhiOfLunarYear(l.year) + '年 · 属' + zodiacOfLunarYear(l.year) + '<br>公历 ' +
            s.year + '年' + pad2(s.month) + '月' + pad2(s.day) + '日 星期' + solarWeekdayCn(s.year, s.month, s.day);
        document.getElementById('lunarRangeNote').textContent =
            '数据源：香港天文台《公曆與農曆日期對照表》 · 支持 ' + LUNAR_RANGE.minText + ' 至 ' + LUNAR_RANGE.maxText;

        refreshLunarQuickButtons();
    }

    // ================= 模块五：下拉刷新 =================
    // 死区防误触 → 出死区后方向一锤定音 → 阈值按屏高推导（小屏上手指行程占比才不会偏重）
    function setupPullToRefresh() {
        const el = document.getElementById('ptrIndicator');
        if (!el) return;
        const DEADZONE = 16;      // 起手死区：按下瞬间的抖动不算下拉
        const DAMPING = 0.42;     // 阻尼：手指位移 × 它 = 指示器位移
        const MAX_PULL = 120;     // 再往下拉指示器也不动了
        function threshold() { return Math.min(100, Math.max(56, window.innerHeight * 0.1)); }

        let startX = 0, startY = 0, pulling = false, locked = false, distance = 0, refreshing = false;

        // 有浮层时不接管手势：日期选择弹窗、任何展开着的下拉菜单
        function blocked() {
            const modal = document.getElementById('datePickerModal');
            if (modal && modal.classList.contains('show')) return true;
            if (document.querySelector('.select-menu.show')) return true;
            return false;
        }
        function paint(d) {
            distance = d;
            el.classList.remove('ptr-animate');
            el.style.transform = 'translateY(' + d + 'px)';
            el.style.opacity = Math.min(1, d / (threshold() * 0.8));
            if (d >= threshold()) el.classList.add('ptr-ready'); else el.classList.remove('ptr-ready');
        }
        function reset(animate) {
            distance = 0;
            if (animate) el.classList.add('ptr-animate'); else el.classList.remove('ptr-animate');
            el.style.transform = 'translateY(0)';
            el.style.opacity = '0';
            el.classList.remove('ptr-ready');
        }

        document.addEventListener('touchstart', function (e) {
            if (refreshing || blocked() || e.touches.length !== 1 || window.scrollY > 0) { pulling = false; return; }
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            pulling = true;
            locked = false;
        }, { passive: true });

        document.addEventListener('touchmove', function (e) {
            if (!pulling || refreshing) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            if (!locked) {
                if (Math.abs(dy) < DEADZONE && Math.abs(dx) < DEADZONE) return;          // 还在死区，继续观察
                if (dy <= 0 || Math.abs(dx) > Math.abs(dy)) { pulling = false; return; } // 上滑/横滑，整次弃权
                locked = true;
            }
            // 下拉到一半改主意往上滑：交还控制权，否则页面会卡住不动
            if (dy <= 0 || window.scrollY > 0) { pulling = false; locked = false; reset(true); return; }
            paint(Math.min((dy - DEADZONE) * DAMPING, MAX_PULL));
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', function () {
            if (!pulling || !locked || refreshing) { pulling = false; locked = false; return; }
            pulling = false;
            locked = false;
            if (distance < threshold()) { reset(true); return; }
            refreshing = true;
            el.classList.add('ptr-animate', 'ptr-loading');
            el.style.transform = 'translateY(' + threshold() + 'px)';
            try { sessionStorage.setItem('ptr-fired', String(Date.now())); } catch (err) {}
            // 留一下 spinner，否则直接白屏像卡死
            setTimeout(function () { location.reload(); }, 260);
        }, { passive: true });
    }

    // ================= 全局 Modal 与日历逻辑 =================
    function populateDropdowns() {
        const yearMenu = document.getElementById('yearMenu');
        const monthMenu = document.getElementById('monthMenu');
        let yearHtml = ''; let monthHtml = '';
        for(let i = 1000; i <= 3000; i++) { yearHtml += `<div class="select-item" id="y-${i}" onclick="selectCustomYear(${i})">${i}</div>`;
        }
        for(let i = 1; i <= 12; i++) { monthHtml += `<div class="select-item" id="m-${i}" onclick="selectCustomMonth(${i})">${i}</div>`;
        }
        yearMenu.innerHTML = yearHtml; monthMenu.innerHTML = monthHtml;
    }

    function toggleDropdown(event, menuId) {
        event.stopPropagation();
        const menu = document.getElementById(menuId);
        const isShowing = menu.classList.contains('show');
        closeAllDropdowns(event);
        if (!isShowing) {
            menu.classList.add('show');
            const activeId = menuId === 'yearMenu' ? `y-${viewYear}` : `m-${viewMonth}`;
            const activeItem = document.getElementById(activeId);
            if (activeItem) activeItem.scrollIntoView({ block: "center", behavior: "instant" });
        }
    }

    function closeAllDropdowns(event) {
        document.getElementById('yearMenu').classList.remove('show');
        document.getElementById('monthMenu').classList.remove('show');
    }

    function selectCustomYear(y) { viewYear = y; renderCalendar(); }
    function selectCustomMonth(m) { viewMonth = m; renderCalendar(); }

    function updateDropdownUI() {
        document.getElementById('yearDisplay').textContent = viewYear;
        document.getElementById('monthDisplay').textContent = viewMonth;
        document.querySelectorAll('#yearMenu .select-item').forEach(el => el.classList.remove('selected'));
        document.querySelectorAll('#monthMenu .select-item').forEach(el => el.classList.remove('selected'));
        const yItem = document.getElementById(`y-${viewYear}`);
        const mItem = document.getElementById(`m-${viewMonth}`);
        if(yItem) yItem.classList.add('selected');
        if(mItem) mItem.classList.add('selected');
    }

    function stepModalTime(id, delta, maxVal) {
        const input = document.getElementById(id);
        let val = parseInt(input.value, 10);
        if (isNaN(val)) val = 0;
        val += delta;
        if (val > maxVal) val = 0;
        if (val < 0) val = maxVal;      
        input.value = String(val).padStart(2, '0');
    }

    function padModalInput(input, maxVal) {
        let val = parseInt(input.value, 10);
        if (isNaN(val)) val = 0;
        if (val > maxVal) val = maxVal;
        if (val < 0) val = 0;
        input.value = String(val).padStart(2, '0');
    }

    function resetModalTime() {
        document.getElementById('modalH').value = '00';
        document.getElementById('modalM').value = '00';
        document.getElementById('modalS').value = '00';
    }

    function openModal(target) {
        currentModalTarget = target;
        let initDate = dates[target] ? {...dates[target]} : getBeijingTimeObj();
        
        viewYear = initDate.year; 
        viewMonth = initDate.month; 
        selectedDay = initDate.day;
        document.getElementById('modalH').value = String(initDate.hour).padStart(2, '0');
        document.getElementById('modalM').value = String(initDate.minute).padStart(2, '0');
        document.getElementById('modalS').value = String(initDate.second).padStart(2, '0');
        
        renderCalendar();
        document.getElementById('datePickerModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('datePickerModal').classList.remove('show');
        closeAllDropdowns(new Event('click'));
    }

    function jumpToTodayModal() {
        const today = getBeijingTimeObj();
        viewYear = today.year; viewMonth = today.month; selectedDay = today.day;
        document.getElementById('modalH').value = String(today.hour).padStart(2, '0');
        document.getElementById('modalM').value = String(today.minute).padStart(2, '0');
        document.getElementById('modalS').value = String(today.second).padStart(2, '0');
        renderCalendar();
    }

    function selectDay(day) { selectedDay = day; renderCalendar(); }

    function renderCalendar() {
        updateDropdownUI();
        const firstDayDate = new Date(Date.UTC(viewYear, viewMonth - 1, 1));
        let startDayOfWeek = firstDayDate.getUTCDay(); 
        startDayOfWeek = startDayOfWeek === 0 ? 7 : startDayOfWeek; 
        const daysInMonth = new Date(Date.UTC(viewYear, viewMonth, 0)).getUTCDate();
        const actualToday = getBeijingTimeObj();
        const isCurrentMonthYear = (actualToday.year === viewYear && actualToday.month === viewMonth);
        const daysContainer = document.getElementById('modalDays');
        daysContainer.innerHTML = '';
        for (let i = 1; i < startDayOfWeek; i++) { daysContainer.innerHTML += `<div class="empty"></div>`;
        }
        for (let i = 1; i <= daysInMonth; i++) {
            const isSelected = (i === selectedDay);
            const isActualToday = (isCurrentMonthYear && i === actualToday.day);
            let classNames = [];
            if (isSelected) classNames.push('selected');
            if (isActualToday) classNames.push('today');
            daysContainer.innerHTML += `<div class="${classNames.join(' ')}" onclick="selectDay(${i})">${i}</div>`;
        }
    }

    function confirmModal() {
        const h = parseInt(document.getElementById('modalH').value) || 0;
        const m = parseInt(document.getElementById('modalM').value) || 0;
        const s = parseInt(document.getElementById('modalS').value) || 0;
        dates[currentModalTarget] = { year: viewYear, month: viewMonth, day: selectedDay, hour: Math.min(23, h), minute: Math.min(59, m), second: Math.min(59, s) };
        const triggerId = currentModalTarget + 'Trigger';
        const placeholderText = currentModalTarget.includes('Start') ? '请选择开始时间...' : (currentModalTarget.includes('End') ? '请选择结束时间...' : '请选择时间...');
        document.getElementById(triggerId).innerHTML = formatDateTimeHtml(dates[currentModalTarget], placeholderText);
        
        closeModal();

        if (currentModalTarget === 'base') calculate();
        else calculateDiff();
    }

    function initKeyboardFix() {
        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                setTimeout(() => {
                    this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            });
        });
    }

    window.onload = () => {
        populateDropdowns();
        setBaseToNow();
        setDiffStartToNow();
        setLunarToToday();
        initKeyboardFix();
        setupPullToRefresh();
        document.addEventListener('click', closeLunarMenus);
    };
</script>
